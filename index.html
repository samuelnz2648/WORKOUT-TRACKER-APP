<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Workout Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Workout Tracker</h1>
    <div class="topbar-actions">
      <button id="syncStatus" class="pill" type="button" title="Tap to sync now">…</button>
      <button id="settingsBtn" class="icon" type="button" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main id="main"></main>

  <!-- Add exercise -->
  <dialog id="exerciseDialog">
    <form id="exerciseForm" method="dialog">
      <div class="dialog-head">
        <h2>Add exercise</h2>
        <select id="exerciseFilter" aria-label="Filter by category">
          <option value="ALL">All</option>
          <option value="PUSH">Push</option>
          <option value="PULL">Pull</option>
          <option value="LEGS">Legs</option>
          <option value="NONE">Uncategorised</option>
        </select>
      </div>
      <input id="exerciseName" type="text" placeholder="Search or type a new name" autocomplete="off" required>
      <div id="catPicker" class="cat-picker" hidden>
        <span id="catPickerLabel"></span>
        <div class="seg">
          <button type="button" data-cat="PUSH" class="cat-PUSH">Push</button>
          <button type="button" data-cat="PULL" class="cat-PULL">Pull</button>
          <button type="button" data-cat="LEGS" class="cat-LEGS">Legs</button>
        </div>
      </div>
      <div id="exerciseChips" class="chips"></div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settingsDialog">
    <form id="settingsForm" method="dialog">
      <h2>Connect your Google Sheet</h2>
      <label>Apps Script web app URL
        <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" required>
      </label>
      <label>API token
        <input id="cfgToken" type="text" placeholder="From the setup() log" autocomplete="off" required>
      </label>
      <p id="settingsMsg" class="msg"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Close</button>
        <button type="submit" class="btn primary">Save &amp; test</button>
      </div>
    </form>
  </dialog>

  <!-- Delete workout -->
  <dialog id="deleteDialog">
    <form id="deleteForm" method="dialog">
      <h2>Delete workout?</h2>
      <p id="deleteSummary" class="dialog-text"></p>
      <label id="deleteExWrap" class="check-row">
        <input id="deleteEx" type="checkbox" checked>
        <span>Also remove <strong id="deleteExNames"></strong> from your exercise list. They aren't used in any other workout.</span>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn danger">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
